global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "sdn-primary"
    static_configs:
      - targets: ["localhost:8000"]
    relabel_configs:
      - target_label: instance
        replacement: primary

  - job_name: "sdn-backup"
    static_configs:
      - targets: ["localhost:8001"]
    relabel_configs:
      - target_label: instance
        replacement: backup
