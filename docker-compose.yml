services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 20
    restart: unless-stopped

  ryu-primary:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      REDIS_HOST: redis
      CONTROLLER_ROLE: primary
    ports:
      - "127.0.0.1:6633:6633"
      - "127.0.0.1:5000:5000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/health"]
      interval: 3s
      timeout: 2s
      retries: 20
    restart: unless-stopped

  ryu-backup:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      REDIS_HOST: redis
      CONTROLLER_ROLE: backup
    ports:
      - "127.0.0.1:6634:6633"
      - "127.0.0.1:5001:5000"
    depends_on:
      redis:
        condition: service_healthy
      ryu-primary:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.2.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./docker/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./docker/grafana/dashboard.json:/etc/grafana/provisioning/dashboards/dashboard.json:ro
      - ./docker/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  redis-data:
