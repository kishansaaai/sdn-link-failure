name: Lint and container
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: mypy ryu_controller/topology_graph.py ha --ignore-missing-imports
  docker:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait
      - run: curl --fail --retry 15 --retry-delay 2 --retry-connrefused http://localhost:5000/health
      - run: curl --fail --retry 15 --retry-delay 2 --retry-connrefused http://localhost:5001/health
      - run: python3 scripts/verify_stack.py
      - if: always()
        run: docker compose logs && docker compose down
